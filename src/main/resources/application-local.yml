# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/familybudget
spring.datasource.username=postgres
spring.datasource.password=postgres
  
  # JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
  
  # JWT Configuration
jwt.secret=your-very-long-secret-key-minimum-32-chars-here-make-it-long
jwt.issuer=family-budget
jwt.access-token-ttl-min=30
jwt.refresh-token-ttl-days=30
  
  # Server
server.port=8081
  
  # Disable Flyway for now (optional)
spring.flyway.enabled=false