# Prod profile: Postgres, no dev endpoints, H2 disabled
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/familybudget}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: false

# Keep dev endpoints off in prod
app:
  security:
    allow-dev-endpoints: false

# Actuator: expose only health (with probes)
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8081
