name: CI/CD

on:
  push:
    branches: [ "main", "features/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_BUILDKIT: 1

jobs:
  build-test-image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & Test (Maven)
        run: mvn -B -U -DskipTests=false clean verify

      - name: Decide push permission
        id: pushcheck
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "push_allowed=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.event.pull_request.head.repo.full_name }}" == "${{ github.repository }}" ]]; then
            echo "push_allowed=true" >> $GITHUB_OUTPUT
          else
            echo "push_allowed=false" >> $GITHUB_OUTPUT
          fi

      - name: Login to GHCR
        if: steps.pushcheck.outputs.push_allowed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        if: steps.pushcheck.outputs.push_allowed == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=raw,value=pr-${{ github.event.pull_request.number }},enable=${{ github.event_name == 'pull_request' }}


      - name: Build (and optionally push) Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.pushcheck.outputs.push_allowed == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
